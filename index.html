<!-- language: HTML, file: index.html -->
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistem Absensi Mahasiswa</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header class="header">
      <h1>📌 Absensi Mahasiswa</h1>
      <p>Masukkan NIM, nama, dan kode absensi untuk mencatat kehadiran.</p>
    </header>

    <main class="main-content">
      <!-- Form Input Absensi -->
      <section class="card">
        <h2>Form Presensi</h2>
        <form id="attendance-form" class="form">
          <div class="form-group">
            <label for="student-nim">NIM Mahasiswa</label>
            <input type="text" id="student-nim" placeholder="Contoh: H1H026013" required autocomplete="off">
          </div>

          <div class="form-group">
            <label for="student-name">Nama Lengkap</label>
            <input type="text" id="student-name" placeholder="Contoh: Muhammad Rifqi Firmansyah" required autocomplete="off">
          </div>

          <div class="form-group">
            <label for="attendance-code">Kode Absensi (Kode Hari Ini: <strong id="valid-code-display">PRESEN2026</strong>)</label>
            <input type="text" id="attendance-code" placeholder="Masukkan kode..." required autocomplete="off">
          </div>

          <div class="form-group">
            <label for="student-status">Status Kehadiran</label>
            <select id="student-status">
              <option value="Hadir">Hadir</option>
              <option value="Izin">Izin</option>
              <option value="Sakit">Sakit</option>
            </select>
          </div>

          <button type="submit" class="btn btn-primary">Kirim Presensi</button>
        </form>
        <div id="message-box" class="message hidden"></div>
      </section>

      <!-- Tabel Data Absensi -->
      <section class="card">
        <div class="card-header">
          <h2>Data Kehadiran</h2>
          <button id="clear-data-btn" class="btn btn-danger">Hapus Semua Data</button>
        </div>

        <div class="table-responsive">
          <table class="table">
            <thead>
              <tr>
                <th>Waktu</th>
                <th>NIM</th>
                <th>Nama</th>
                <th>Status</th>
                <th>Aksi</th>
              </tr>
            </thead>
            <tbody id="attendance-tbody">
              <!-- Data dimasukkan otomatis oleh JS -->
            </tbody>
          </table>
        </div>
      </section>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
