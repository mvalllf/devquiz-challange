<!-- language: HTML, file: index.html -->
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz Interaktif Pemrograman</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header class="header">
      <h1>🚀 DevQuiz Challenge</h1>
      <p>Uji pengetahuan dasarmu seputar HTML, CSS, dan JavaScript!</p>
    </header>

    <main class="quiz-card">
      <!-- Tampilan Halaman Utama / Mulai -->
      <div id="start-screen" class="screen">
        <h2>Selamat Datang, Peserta!</h2>
        <p>Kamu akan menjawab beberapa pertanyaan pilihan ganda. Skor tertinggi akan tersimpan otomatis.</p>
        <button id="start-btn" class="btn btn-primary">Mulai Kuis</button>
      </div>

      <!-- Tampilan Pertanyaan Kuis -->
      <div id="quiz-screen" class="screen hidden">
        <div class="quiz-info">
          <span id="question-number">Soal 1 dari 4</span>
          <span id="high-score-display">Skor Tertinggi: 0</span>
        </div>
        <h2 id="question-text">Pertanyaan akan muncul di sini...</h2>
        <div id="options-container" class="options-grid">
          <!-- Opsi jawaban dimasukkan via JS -->
        </div>
      </div>

      <!-- Tampilan Hasil Akhir -->
      <div id="result-screen" class="screen hidden">
        <h2>Kuis Selesai! 🎉</h2>
        <p id="final-score-text">Skor kamu: 0</p>
        <button id="restart-btn" class="btn btn-primary">Ulangi Kuis</button>
      </div>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
